name: Guest service permission contracts
on:
  push:
    paths:
      - 'runtime_overlay/ConnectivityStub.java'
      - 'runtime_overlay/GuestLocationHooks.java'
      - 'tests/test_connectivity_uid.py'
      - 'tests/test_location_boundary.py'
      - '.github/workflows/connectivity-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_connectivity_uid.py -v
      - run: python tests/test_location_boundary.py -v

name: PHANToM VPhone Release Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phantom-vphone-rc.yml'
      - 'runtime_patch/**'
      - 'runtime_overlay/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529"

      - name: Fetch VirtualApp runtime
        run: |
          curl -L https://github.com/ISEKHON/VirtualApp/archive/b3c634ad7941765df3da84a207aca94b7861afae.zip -o runtime.zip
          unzip -q runtime.zip
          mv VirtualApp-b3c634ad7941765df3da84a207aca94b7861afae runtime

      - name: Build compile-only Android 16 stubs
        run: |
          mkdir -p android16_stub_classes
          javac -source 8 -target 8 -d android16_stub_classes             runtime_patch/android/window/WindowContextInfo.java             runtime_patch/android/window/ActivityWindowInfo.java             runtime_patch/android/window/SplashScreenView.java             runtime_patch/android/app/PictureInPictureUiState.java
          jar cf runtime/lib/android16-stubs.jar -C android16_stub_classes .
          sed -i "/dependencies {/a\    compileOnly files('android16-stubs.jar')" runtime/lib/build.gradle

      - name: Apply PHANToM overlays and patches
        run: |
          cp runtime_overlay/CameraProviderPicker.java             runtime/app/src/main/java/io/virtualapp/home/CameraProviderPicker.java
          cp runtime_overlay/GuestPermissionBroker.java             runtime/app/src/main/java/io/virtualapp/home/GuestPermissionBroker.java
          cp runtime_overlay/GuestPermissionSettingsActivity.java             runtime/app/src/main/java/io/virtualapp/settings/GuestPermissionSettingsActivity.java
          cp runtime_overlay/app_manage_menu.xml             runtime/app/src/main/res/menu/app_manage_menu.xml
          cp runtime_overlay/GuestPermissionPolicy.java             runtime/lib/src/main/java/com/lody/virtual/helper/utils/GuestPermissionPolicy.java
          cd runtime
          patch -p1 < ../runtime_patch/android16_transaction_handler.patch
          patch -p1 < ../runtime_patch/camera_provider.patch
          patch -p1 < ../runtime_patch/shared_device_storage.patch
          patch -p1 < ../runtime_patch/short_native_hook_guard.patch
          patch -p1 < ../runtime_patch/native_open_redirect.patch
          patch -p1 < ../runtime_patch/critical_binder_uid_guard.patch
          patch -p1 < ../runtime_patch/modern_unbind_finished.patch
          patch -p1 < ../runtime_patch/modern_storage_appops.patch
          patch -p1 < ../runtime_patch/permission_broker_xposed.patch
          patch -p1 < ../runtime_patch/guest_permission_settings.patch
          patch -p1 < ../runtime_patch/cmd_receiver_security.patch

          # Android 10-16 activity/browser compatibility layers that must not
          # be dropped when CI fetches a clean upstream VirtualApp tree.
          cp ../runtime_patch/mirror/android/app/ActivityTaskManager.java             lib/src/main/java/mirror/android/app/ActivityTaskManager.java
          cp ../runtime_patch/mirror/android/app/InstrumentationActivity.java             lib/src/main/java/mirror/android/app/InstrumentationActivity.java
          cp ../runtime_patch/mirror/android/app/InstrumentationString.java             lib/src/main/java/mirror/android/app/InstrumentationString.java
          cp ../runtime_patch/mirror/android/app/InstrumentationUser.java             lib/src/main/java/mirror/android/app/InstrumentationUser.java
          mkdir -p lib/src/main/java/com/lody/virtual/client/hook/proxies/role
          cp ../runtime_patch/com/lody/virtual/client/hook/proxies/role/RoleManagerStub.java             lib/src/main/java/com/lody/virtual/client/hook/proxies/role/RoleManagerStub.java

          patch -p1 < ../runtime_patch/activity_task_manager_injection.patch
          patch -p1 < ../runtime_patch/app_instrumentation_start_activity.patch
          patch -p1 < ../runtime_patch/role_manager_invocation.patch
          mkdir -p lib/src/main/java/com/lody/virtual/client/hook/proxies/permission
          cp ../runtime_overlay/PermissionManagerStub.java lib/src/main/java/com/lody/virtual/client/hook/proxies/permission/PermissionManagerStub.java
          cp ../runtime_overlay/CaptureBridgeProvider.java lib/src/main/java/com/lody/virtual/client/stub/CaptureBridgeProvider.java
          cp ../runtime_overlay/ConnectivityStub.java lib/src/main/java/com/lody/virtual/client/hook/proxies/connectivity/ConnectivityStub.java
          cp ../runtime_overlay/GuestLocationHooks.java lib/src/main/java/com/lody/virtual/client/hook/proxies/location/GuestLocationHooks.java
          patch -p1 < ../runtime_patch/modern_device_location.patch
          patch -p1 < ../runtime_patch/modern_permission_capture_output.patch
          patch -p1 < ../runtime_patch/screen_capture_observer_permission.patch
          patch -p1 < ../runtime_patch/modern_broadcast.patch
          patch -p1 < ../runtime_patch/capture_host_and_device_permission.patch
          patch -p1 < ../runtime_patch/prevent_guest_activity_escape.patch
          cp ../runtime_overlay/NotificationChannelHooks.java lib/src/main/java/com/lody/virtual/client/hook/proxies/notification/NotificationChannelHooks.java
          patch -p1 < ../runtime_patch/notification_channels.patch
          mkdir -p lib/src/main/java/com/lody/virtual/client/hook/proxies/locale
          cp ../runtime_overlay/LocaleManagerStub.java lib/src/main/java/com/lody/virtual/client/hook/proxies/locale/LocaleManagerStub.java
          patch -p1 < ../runtime_patch/guest_service_identity.patch
          patch -p1 < ../runtime_patch/modern_internal_provider_uid.patch
          patch -p1 < ../runtime_patch/pending_intent_feature.patch
          patch -p1 < ../runtime_patch/guest_provider_boundary.patch
          patch -p1 < ../runtime_patch/authentic_apk_signing.patch
          patch -p1 < ../runtime_patch/engine_diagnostics.patch
          patch -p1 < ../runtime_patch/capture_result_diagnostics.patch
          cd ..
          cp runtime_overlay/BaseVirtualInitializer.java             runtime/app/src/main/java/io/virtualapp/delegate/BaseVirtualInitializer.java
          cp runtime_overlay/GmsSupport.java             runtime/lib/src/main/java/com/lody/virtual/GmsSupport.java
          cp runtime_overlay/EngineDiagnosticsActivity.java runtime/app/src/main/java/io/virtualapp/settings/EngineDiagnosticsActivity.java
          cp runtime_overlay/SettingsActivity.java             runtime/app/src/main/java/io/virtualapp/settings/SettingsActivity.java
          cp runtime_overlay/LoadingActivity.java             runtime/app/src/main/java/io/virtualapp/home/LoadingActivity.java
          cp runtime_overlay/NewHomeActivity.java             runtime/app/src/main/java/io/virtualapp/home/NewHomeActivity.java
          cp runtime_overlay/HomeAppAdapter.java             runtime/app/src/main/java/io/virtualapp/home/adapters/HomeAppAdapter.java
          cp -r runtime_overlay/res/* runtime/app/src/main/res/

      - name: Validate merged manifest source
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("runtime/app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          activities = [a for a in root.findall("application/activity")
                        if a.get(android + "name") == ".settings.EngineDiagnosticsActivity"]
          assert len(activities) == 1 and activities[0].get(android + "exported") == "false"
          PY

      - name: Assert browser/activity compatibility hooks
        run: |
          grep -q 'IActivityTaskManagerSingleton' runtime/lib/src/main/java/com/lody/virtual/client/hook/proxies/am/ActivityTaskManagerStub.java
          grep -q 'execStartActivity virtualized' runtime/lib/src/main/java/com/lody/virtual/client/hook/delegate/AppInstrumentation.java
          grep -q 'new RoleManagerStub' runtime/lib/src/main/java/com/lody/virtual/client/core/InvocationStubManager.java
          grep -q 'InstrumentationActivity' runtime/lib/src/main/java/mirror/android/app/InstrumentationActivity.java

      - name: Rebrand PHANToM VPhone
        working-directory: runtime
        run: |
          sed -i 's/applicationId "io.va.exposed64"/applicationId "com.phantom.vphone"/' app/build.gradle
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          path = Path("app/build.gradle")
          field = "    buildConfigField 'String', 'DIAGNOSTICS_SOURCE', " + repr(json.dumps(os.environ["GITHUB_SHA"]))
          path.write_text(path.read_text().replace("defaultConfig {", "defaultConfig {\n" + field))
          PY
          sed -i 's/versionCode 1/versionCode 76/' app/build.gradle
          sed -i 's/versionName "1.0.0"/versionName "0.4.9-dev"/' app/build.gradle
          sed -i 's#<string name="app_name">VirtualApp</string>#<string name="app_name">PHANToM VPhone</string>#' app/src/main/res/values/strings.xml
          sed -i 's#<string name="vxp">VirtualApp</string>#<string name="vxp">PHANToM VPhone</string>#' app/src/main/res/values/strings.xml
          sed -i 's/VirtualApp-${variant.versionName}-${abi}.apk/PHANToM-VPhone-${variant.versionName}-${abi}.apk/' app/build.gradle

      - name: Configure stable alpha signing
        env:
          PHANTOM_KEYSTORE_BASE64: ${{ secrets.PHANTOM_ALPHA_KEYSTORE_BASE64 }}
        run: |
          test -n "$PHANTOM_KEYSTORE_BASE64"
          printf '%s' "$PHANTOM_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/phantom-alpha.jks"
          cat >> runtime/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  phantomAlpha {
                      storeFile file(System.getenv("PHANTOM_KEYSTORE_PATH"))
                      storePassword System.getenv("PHANTOM_STORE_PASSWORD")
                      keyAlias System.getenv("PHANTOM_KEY_ALIAS")
                      keyPassword System.getenv("PHANTOM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.phantomAlpha
                  }
                  release {
                      signingConfig signingConfigs.phantomAlpha
                  }
              }
          }
          EOF

      - name: Build APKs
        working-directory: runtime
        env:
          PHANTOM_KEYSTORE_PATH: ${{ github.workspace }}/phantom-alpha.jks
          PHANTOM_STORE_PASSWORD: ${{ secrets.PHANTOM_ALPHA_STORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.PHANTOM_ALPHA_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.PHANTOM_ALPHA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signing
        env:
          PHANTOM_KEYSTORE_PATH: ${{ github.workspace }}/phantom-alpha.jks
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose runtime/app/build/outputs/apk/release/*-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose runtime/app/build/outputs/apk/release/*-universal.apk

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: PHANToM-VPhone-v0.4.9-dev-arm64
          path: runtime/app/build/outputs/apk/release/*-arm64-v8a.apk
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: PHANToM-VPhone-v0.4.9-dev-universal
          path: runtime/app/build/outputs/apk/release/*-universal.apk
          retention-days: 14

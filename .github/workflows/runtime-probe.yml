name: Runtime Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runtime-probe.yml'

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install NDK 21.4
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529"
      - name: Fetch VirtualApp source
        run: |
          curl -L https://github.com/ISEKHON/VirtualApp/archive/refs/heads/main.zip -o runtime.zip
          unzip -q runtime.zip
          mv VirtualApp-main runtime
      - name: Build runtime
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload runtime APKs
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-runtime-probe
          path: runtime/app/build/outputs/apk/debug/*.apk
          retention-days: 7

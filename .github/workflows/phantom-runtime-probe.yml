name: PHANToM Runtime Probe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529"
      - name: Fetch runtime
        run: |
          curl -L https://github.com/ISEKHON/VirtualApp/archive/refs/heads/main.zip -o runtime.zip
          unzip -q runtime.zip
          mv VirtualApp-main runtime
      - name: Apply PHANToM compatibility patches
        run: |
          mkdir -p runtime/lib/src/main/java/android/window
          mkdir -p runtime/lib/src/main/java/android/app
          mkdir -p runtime/lib/src/main/java/com/lody/virtual/client/hook/proxies/role
          mkdir -p runtime/lib/src/main/java/mirror/android/app
          cp runtime_patch/android/window/*.java runtime/lib/src/main/java/android/window/
          cp runtime_patch/android/app/PictureInPictureUiState.java runtime/lib/src/main/java/android/app/
          cp runtime_patch/com/lody/virtual/client/hook/proxies/role/RoleManagerStub.java runtime/lib/src/main/java/com/lody/virtual/client/hook/proxies/role/
          cp runtime_patch/mirror/android/app/ActivityTaskManager.java runtime/lib/src/main/java/mirror/android/app/
          cp runtime_patch/mirror/android/app/Instrumentation*.java runtime/lib/src/main/java/mirror/android/app/
          cd runtime
          patch -p1 < ../runtime_patch/android16_transaction_handler.patch
          patch -p1 < ../runtime_patch/role_manager_invocation.patch
          patch -p1 < ../runtime_patch/activity_task_manager_injection.patch
          patch -p1 < ../runtime_patch/app_instrumentation_start_activity.patch
      - name: Rebrand probe
        working-directory: runtime
        run: |
          sed -i 's/applicationId "io.va.exposed64"/applicationId "com.phantom.vphone.runtime"/' app/build.gradle
          sed -i 's/versionCode 1/versionCode 45/' app/build.gradle
          sed -i 's/versionName "1.0.0"/versionName "0.4.0-alpha-probe6"/' app/build.gradle
          sed -i 's#<string name="app_name">VirtualApp</string>#<string name="app_name">PHANToM VPhone</string>#' app/src/main/res/values/strings.xml
          sed -i 's#<string name="vxp">VirtualApp</string>#<string name="vxp">PHANToM VPhone</string>#' app/src/main/res/values/strings.xml
      - name: Build
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PHANToM-runtime-probe6
          path: runtime/app/build/outputs/apk/debug/*-arm64-v8a.apk
          retention-days: 7

name: Diagnostics evidence contracts
on:
  push:
    paths:
      - 'diagnostics/**'
      - 'tests/test_diagnostics_model.py'
      - '.github/workflows/diagnostics-contracts.yml'
  pull_request:
    paths:
      - 'diagnostics/**'
      - 'tests/test_diagnostics_model.py'
      - '.github/workflows/diagnostics-contracts.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_diagnostics_model.py -v
      - run: python -m compileall -q diagnostics
      - run: python -m diagnostics.report diagnostics/examples/unmeasured.json --html diagnostics-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostics-report-not-runtime-proof
          path: diagnostics-report.html

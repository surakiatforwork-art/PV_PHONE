name: Guest device profile contracts
on:
  push:
    paths:
      - 'runtime_overlay/GuestDeviceProfile.java'
      - 'runtime_overlay/GuestDeviceProperties.h'
      - 'runtime_patch/guest_device_profile.patch'
      - 'runtime_overlay/GuestShortcutQuery.java'
      - 'runtime_patch/modern_shortcut_query.patch'
      - 'runtime_overlay/GuestApkFiles.java'
      - 'runtime_patch/split_apk_filenames.patch'
      - 'tests/test_guest_apk_files.py'
      - 'tests/test_shortcut_query.py'
      - 'tests/test_device_profile.py'
      - 'tests/test_device_properties.py'
      - '.github/workflows/device-profile-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_device_profile.py -v
      - run: python tests/test_device_properties.py -v
      - run: python tests/test_shortcut_query.py -v
      - run: python tests/test_guest_apk_files.py -v
